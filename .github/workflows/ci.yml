name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dala art arda push yapılınca eski çalışmayı iptal et (dakika tasarrufu).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Kelime verisi güncel mi?
        run: |
          python3 tool/build_words.py
          git diff --exit-code assets/data/words.json
      - run: mkdir -p ci-out && flutter --version | tee ci-out/flutter-version.txt
      - run: flutter pub get 2>&1 | tee ci-out/pub-get.txt
      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee ci-out/analyze.txt; exit ${PIPESTATUS[0]}
      - name: Test
        run: flutter test 2>&1 | tee ci-out/test.txt; exit ${PIPESTATUS[0]}
      - name: Yükleme anahtarını hazırla (GitHub Secrets varsa)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Yükleme anahtarıyla imzalanacak." | tee ci-out/signing.txt
          else
            echo "Yükleme anahtarı yok: debug anahtarıyla imzalanacak (Play'e yüklenemez)." | tee ci-out/signing.txt
          fi
      - name: Android APK + AAB
        env:
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          ADMOB_REWARDED_ANDROID: ${{ secrets.ADMOB_REWARDED_ANDROID }}
          ADMOB_BANNER_ANDROID: ${{ secrets.ADMOB_BANNER_ANDROID }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: |
          DEFINES=$(bash tool/dart_defines.sh)
          if [ -n "$ADMOB_APP_ID_ANDROID" ]; then export ORG_GRADLE_PROJECT_ADMOB_APP_ID="$ADMOB_APP_ID_ANDROID"; fi
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES 2>&1 | tee ci-out/build-apk.txt; [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          flutter build appbundle --release --build-number=${{ github.run_number }} $DEFINES 2>&1 | tail -5 | tee ci-out/build-aab.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: ingilizce-kartlar-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ingilizce-kartlar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: APK'yı "latest-apk" sürümüne yükle (doğrudan indirme linki)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ingilizce-kartlar.apk
          cp build/app/outputs/bundle/release/app-release.aab ingilizce-kartlar.aab
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk ingilizce-kartlar.apk ingilizce-kartlar.aab \
            --title "Test APK (son derleme)" \
            --notes "Otomatik derleme: ${GITHUB_SHA} (sürüm kodu ${{ github.run_number }}). AAB Play Console içindir." \
            --prerelease --target "${GITHUB_SHA}"
      - name: Logları ci-logs dalına yaz
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r ci-out /tmp/ci-out
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf android-logs && mkdir -p android-logs && cp -r /tmp/ci-out/* android-logs/
          echo "${GITHUB_SHA} $(date -u)" > android-logs/SHA.txt
          git add android-logs
          git commit -m "CI android logs ${GITHUB_SHA}" || true
          git push -f origin ci-logs

  ios-build:
    # Mac makineleri ücretsiz dakikaları ~10 kat hızlı tüketir.
    # Bu yüzden iOS derlemesi sadece elle başlatılınca çalışır
    # (Actions > CI > Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: test-and-android
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS derlemesi (imzasız — sadece derlenebildiğini doğrular)
        run: mkdir -p /tmp/ios-out && flutter build ios --release --no-codesign 2>&1 | tee /tmp/ios-out/build-ios.txt; exit ${PIPESTATUS[0]}
      - name: Logları ci-logs dalına yaz
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs:refs/remotes/origin/ci-logs
          git checkout -f -B ci-logs origin/ci-logs
          rm -rf ios-logs && mkdir -p ios-logs && cp /tmp/ios-out/* ios-logs/ || true
          tail -c 200000 ios-logs/build-ios.txt > ios-logs/tail.txt 2>/dev/null || true
          echo "${GITHUB_SHA} $(date -u)" > ios-logs/SHA.txt
          git add ios-logs
          git commit -m "CI ios logs ${GITHUB_SHA}" || true
          git push origin ci-logs
