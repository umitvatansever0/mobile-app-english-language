name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Kelime verisi güncel mi?
        run: |
          python3 tool/build_words.py
          git diff --exit-code assets/data/words.json
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Android APK (test reklam kimlikleri, debug imzalı)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ingilizce-kartlar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios-build:
    runs-on: macos-latest
    needs: test-and-android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS derlemesi (imzasız — sadece derlenebildiğini doğrular)
        run: flutter build ios --release --no-codesign
