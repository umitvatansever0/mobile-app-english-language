name: Screens (emulator screenshots)

# 1) Ayrı bir makinede integration_test'i içeren debug APK'yı derler.
# 2) Temiz bir makinede emülatörü açar, APK'yı kurup ekran turunu çalıştırır.
#    (Aynı makinede derleme + emülatör belleği yetirmiyor: ~7.8 GB RAM.)
# Ekran görüntüleri ci-logs dalına (screens/) yazılır.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug -t integration_test/screens_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: screens-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 2

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: screens-apk
          path: build/app/outputs/flutter-apk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Emülatörde ekran turu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/screens.sh
      - name: Görüntüleri ci-logs dalına yaz
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/screens-out && cp -r screenshots/* /tmp/screens-out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs:refs/remotes/origin/ci-logs
          git checkout -f -B ci-logs origin/ci-logs
          rm -rf screens && mkdir -p screens && cp -r /tmp/screens-out/* screens/ 2>/dev/null || true
          echo "${{ github.event.workflow_run.head_sha || github.sha }} $(date -u)" > screens/SHA.txt
          git add screens
          git commit -m "screens ${{ github.event.workflow_run.head_sha || github.sha }}" || true
          git push origin ci-logs

  # Başarısız adımların günlüğünü ci-logs dalına yazar (teşhis için).
  collect-logs:
    needs: [build, screens]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-logs
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p screens-joblog
          gh run view ${{ github.run_id }} --repo ${{ github.repository }} --log-failed > screens-joblog/failed.txt 2>&1 || true
          tail -c 300000 screens-joblog/failed.txt > screens-joblog/failed-tail.txt
          rm screens-joblog/failed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q origin ci-logs || true
          git add screens-joblog
          git commit -m "screens job log ${{ github.run_id }}" || true
          git push origin HEAD:ci-logs
