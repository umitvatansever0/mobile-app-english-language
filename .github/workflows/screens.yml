name: Screens (emulator screenshots)

# Uygulamayı Android emülatöründe integration_test ile gezer ve her ekranın
# görüntüsünü ci-logs dalına (screens/) yazar.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Debug APK'yı önceden derle (emülatör adımını kısaltır)
        run: flutter build apk --debug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emülatörde ekran turu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p /tmp/screens-out
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screens_test.dart 2>&1 | tee /tmp/screens-out/drive.txt || true
            adb logcat -d | grep -E "flutter|AndroidRuntime|FATAL" | tail -300 > /tmp/screens-out/logcat.txt || true
      - name: Görüntüleri ci-logs dalına yaz
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/screens-out && cp -r screenshots/* /tmp/screens-out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs:refs/remotes/origin/ci-logs
          git checkout -f -B ci-logs origin/ci-logs
          rm -rf screens && mkdir -p screens && cp -r /tmp/screens-out/* screens/ 2>/dev/null || true
          git rev-parse HEAD > /dev/null
          echo "${{ github.event.workflow_run.head_sha || github.sha }} $(date -u)" > screens/SHA.txt
          git add screens
          git commit -m "screens ${{ github.event.workflow_run.head_sha || github.sha }}" || true
          git push origin ci-logs
