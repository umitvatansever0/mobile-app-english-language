name: Emulator smoke test

# latest-apk sürümündeki APK'yı Android emülatörüne kurar, açar,
# logcat + ekran görüntüsünü ci-logs dalına yazar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest-apk -p ingilizce-kartlar.apk -D /tmp
      - name: Emülatörde çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/smoke.sh
      - name: Sonuçları ci-logs dalına yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/smoke && cp -r /tmp/smoke-out/* /tmp/smoke/ 2>/dev/null || true
          git fetch origin ci-logs:refs/remotes/origin/ci-logs
          git checkout -f -B ci-logs origin/ci-logs
          rm -rf smoke-logs && mkdir -p smoke-logs && cp -r /tmp/smoke/* smoke-logs/ 2>/dev/null || true
          echo "${GITHUB_SHA} $(date -u)" > smoke-logs/SHA.txt
          git add smoke-logs
          git commit -m "smoke logs ${GITHUB_SHA}" || true
          git push origin ci-logs
