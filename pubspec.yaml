name: ingilizce_calisma_kartlari
description: "İngilizce Kartlar — Türkçe konuşanlar için İngilizce kelime kartları."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  path: ^1.9.0
  flutter_tts: ^4.2.0
  google_mobile_ads: ^9.2.0
  purchases_flutter: ^10.18.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/words.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito_500Medium_Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito_700Bold_Italic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Nunito_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito_900Black.ttf
          weight: 900
